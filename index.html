<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>

<link rel="icon" type="image/svg" href="my-favicon.png">

<style>
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 10px;
    background: linear-gradient(135deg, #0f172a, #2563eb);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    color: #e5e7eb;
  }

  h1 {
    font-size: 1.8rem;
    color: #93c5fd;
    margin-top: 20px;
  }

  .small-note {
    margin-top: 14px;
    font-size: 0.95rem;
    text-align: center;
    width: 90%;
    max-width: 300px;
    line-height: 1.6;
    color: #e0f2fe;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    font-weight: 600;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }

  .card-container {
    width: 90%;
    max-width: 330px;
    margin-top: 10px;
    aspect-ratio: 12 / 17; /* ←これ超重要*←高さを確保 */
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    position: relative;
    background: #ffffff;
  }

  .card-image {
    width: 100%;
    display: block;
     height: auto; /* ←追加 */
    border-radius: 0 0 12px 12px;
  }
  .card-container video {
  width: 100%;
  height: 100%;
  object-fit: cover; /* ←これが効きます */
  display: block;
}

  .veil {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
  }

  .veil.hidden {
    opacity: 0;
    pointer-events: none;
  }

  input[type="password"] {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #94a3b8;
    font-size: 1.1rem;
    width: 200px;
  }

  button {
    margin-top: 12px;
    padding: 10px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #3b82f6;
    color: #fff;
  }

  button:hover {
    background: #2563eb;
  }

  .message, .name, .eng {
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    transition: all 1s ease;
  }

  .name {
    margin-top: 18px;
    font-size: 1.4rem;
    font-weight: 700;
    color: #bfdbfe;
  }

  .eng {
    margin-top: 6px;
    font-size: 0.9rem;
    color: #cbd5f5;
  }

  .message {
    margin-top: 10px;
    font-size: 1rem;
  }

  .show {
    opacity: 1;
    transform: translateY(0);
  }

  .nice {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    font-size: 2rem;
    font-weight: bold;
    color: #93c5fd;
    text-shadow: 0 0 10px rgba(147,197,253,0.6);
    opacity: 0;
    pointer-events: none;
    transition: all 0.6s ease;
  }

  .nice.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.2);
  }
</style>
</head>
<body>

<h1>お誕生日 おめでとう!</h1>

<div class="small-note">
  ＜良い人生の大原則＞<br>
  自信なんて なくてもなんとかなる<br>
  寝れば 朝にはどうでも良くなっている
</div>

<div id="card" class="card-container">
  <video class="card-image" autoplay muted loop playsinline>
  <source src="cyota.mp4" type="video/mp4">
</video>

  <div id="veil" class="veil">
    <div style="text-align:center; color:#1e293b;">
      
      <div style="font-size:1rem; font-weight:600; margin-bottom:8px;">
        Please enter your passcode
      </div>

      <input type="password" id="pw" placeholder="8桁で入力" />
      <br />

      <button onclick="revealCard()">Open!</button>

      <div style="font-size:0.85rem; margin-top:10px; color:#334155; line-height:1.5;">
        passcodeはあなたの生年月日（半角8桁）です<br>
        入力例：1962年7月20日 ⇒ 19620720<br>
        passcode有効期限：2週間
      </div>

    </div>
  </div>
</div>

<div id="name" class="name">長太君へ</div>
<div class="eng" id="eng">Take it easy. You’re doing just fine.</div>
<div id="msg" class="message">⭐君が笑えば、世界は君とともに笑う⭐</div>

<button id="hideBtn" style="display:none;" onclick="hideCard()">もう一度隠す</button>

<div id="nice" class="nice">Nice!</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
const CORRECT = "19970428";

document.getElementById("pw").addEventListener("keydown", function(e) {
  if (e.key === "Enter") revealCard();
});

function revealCard() {
  const v = document.getElementById("pw").value;
  if (v !== CORRECT) {
    alert("Incorrect passcode");
    return;
  }

  document.getElementById("veil").classList.add("hidden");
  document.getElementById("hideBtn").style.display = "block";

  // ★ここ追加（スマホで動画を確実に再生）
  const video = document.querySelector("video");
  if (video) {
    video.play().catch(() => {});
  }

  // Nice演出
  const nice = document.getElementById("nice");
  nice.classList.add("show");
  setTimeout(() => nice.classList.remove("show"), 800);

  // 表示アニメーション
  setTimeout(() => document.getElementById("name").classList.add("show"), 400);
  setTimeout(() => document.getElementById("eng").classList.add("show"), 700);
  setTimeout(() => document.getElementById("msg").classList.add("show"), 1000);

  launchConfetti();
}

function hideCard() {
  document.getElementById("veil").classList.remove("hidden");
  document.getElementById("hideBtn").style.display = "none";

  document.getElementById("name").classList.remove("show");
  document.getElementById("eng").classList.remove("show");
  document.getElementById("msg").classList.remove("show");
}

function launchConfetti() {
  const duration = 2000;
  const end = Date.now() + duration;
  (function frame() {
    confetti({ particleCount: 5, spread: 360 });
    if (Date.now() < end) requestAnimationFrame(frame);
  })();
}
</script>

</body>
</html>
